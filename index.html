    <script>
      // Gracefully ignore Vite HMR WebSocket closing errors in AI Studio sandbox iframe
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullText = args.map(function(a) {
            if (typeof a === 'string') return a;
            if (a && typeof a === 'object') return a.message || a.stack || String(a);
            return String(a);
          }).join(' ');

          if (
            fullText.indexOf('WebSocket') !== -1 ||
            fullText.indexOf('@vite/client') !== -1 ||
            fullText.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('@vite/client') !== -1)) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            String(event.reason).indexOf('WebSocket') !== -1 ||
            String(event.reason).indexOf('@vite/client') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });
      })();
    </script>
