<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Emerald Deep Teal to Cyan -->
    <linearGradient id="cs-bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Silk Wave Sheen Gradient -->
    <linearGradient id="cs-silk-sheen" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5" />
    </linearGradient>

    <!-- Paper Plane Wing Gradient -->
    <linearGradient id="cs-plane-grad" x1="16" y1="12" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>

    <!-- Fold Depth Gradient -->
    <linearGradient id="cs-wing-depth" x1="26" y1="36" x2="42" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99f6e4" />
      <stop offset="50%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Wing Shadow / Depth -->
    <linearGradient id="cs-wing-shadow" x1="24" y1="38" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cs-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#022c22" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Security Border -->
  <rect width="64" height="64" rx="18" fill="url(#cs-bg-grad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Diagonal Silk Luster Wave -->
  <path 
    d="M-8 26 Q32 10 72 38 L72 0 L-8 0 Z" 
    fill="url(#cs-silk-sheen)" 
    opacity="0.6" 
  />

  <!-- Subtle Cloud Arc at the base conveying Cloud Infrastructure -->
  <path 
    d="M12 49 C14 43 21 42 24 46 C27 42 37 42 40 47 C43 44 50 45 52 50 C52 51 48 54 44 54 L18 54 C14 54 11 51 12 49 Z" 
    fill="#ffffff" 
    fill-opacity="0.16" 
  />

  <!-- Enhanced Paper Plane / Swift Send 3D Origami Wing -->
  <g filter="url(#cs-soft-glow)">
    <!-- Main Wing Body -->
    <path 
      d="M51 13 L17 32.5 C15.4 33.3 15.6 35.4 17.2 36 L28 40 L44 23 L32 41.5 L36 49.5 C36.8 51 38.8 50.8 39.5 49.2 L52.8 15.2 C53.4 13.8 52.2 12.5 51 13 Z" 
      fill="url(#cs-plane-grad)" 
    />
    <!-- 3D Inner Fold -->
    <path 
      d="M28 40 L44 23 L32 41.5 Z" 
      fill="url(#cs-wing-depth)" 
      opacity="0.9" 
    />
    <!-- Left Underside Fold for realistic 3D depth -->
    <path 
      d="M28 40 L32 41.5 L30 47 C29.5 48 28.2 47.8 28 46.8 L28 40 Z" 
      fill="url(#cs-wing-shadow)" 
    />
    <!-- Beacon / Relay Pulse at tip -->
    <circle cx="51.5" cy="13.5" r="2.2" fill="#34d399" />
    <circle cx="51.5" cy="13.5" r="4" fill="#a7f3d0" opacity="0.4" />
  </g>

  <!-- Diamond Sparkle Accent -->
  <circle cx="10" cy="10" r="1.5" fill="#ffffff" opacity="0.8" />
</svg>
